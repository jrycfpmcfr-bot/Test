<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0d10">
  <title>Aide-mémoire défauts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1><a href="#" id="home-link">Aide-mémoire défauts</a></h1>
    <div class="topbar-actions">
      <a href="#/sauvegarde" id="btn-backup" class="icon-btn" aria-label="Sauvegarde de mes données" title="Sauvegarde">⇅</a>
      <button type="button" id="btn-text" class="icon-btn" aria-label="Taille du texte" title="Taille du texte">A±</button>
      <button type="button" id="btn-theme" class="icon-btn" aria-label="Changer de thème" title="Thème clair / sombre">◐</button>
    </div>
  </header>

  <main>
    <section id="view-list">
      <form id="search-form" role="search">
        <label for="q" class="sr-only">Code défaut ou symptôme</label>
        <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="characters"
               spellcheck="false" placeholder="Code ou symptôme">
      </form>

      <div class="filters">
        <label>Marque
          <select id="f-marque"><option value="">Toutes</option></select>
        </label>
        <label>Type
          <select id="f-type"><option value="">Tous</option></select>
        </label>
        <label>Gamme
          <select id="f-gamme"><option value="">Toutes</option></select>
        </label>
        <button type="button" id="btn-reset" class="link-btn">Effacer</button>
      </div>

      <div id="home-sections"></div>
      <p id="count" class="count" aria-live="polite"></p>
      <ul id="results" class="results"></ul>
    </section>

    <article id="view-fiche" hidden></article>
    <article id="view-backup" hidden></article>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
