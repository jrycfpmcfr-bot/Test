# Déploiement en un clic sur Render (https://render.com) : bouton dans recette_video/DEPLOIEMENT.md
services:
  - type: web
    name: recette-video
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # 2 Go de RAM : nécessaire pour la transcription audio
    healthCheckPath: /sante
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false           # demandé lors du déploiement
      - key: APP_PASSWORD
        sync: false           # mot de passe pour ouvrir l'application
      - key: WHISPER_MODEL
        value: base
      - key: COOKIES_FILE
        value: /etc/secrets/cookies.txt   # facultatif : « Secret File » nommé cookies.txt
